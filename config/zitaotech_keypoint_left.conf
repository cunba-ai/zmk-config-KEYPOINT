# Hi-res wheel scrolling: advertise a HID Resolution Multiplier (16 units per
# detent) so capable hosts (Windows 11, Linux) scroll in fine sub-notch steps
# instead of whole 3-line notches. The mouse HID report descriptor only exists
# on the split central, so this conf targets the left board only.
#
# NOTE: after flashing this, wheel units emitted by the pointing drivers are
# 1/16 detent. Hosts that ignore the Resolution Multiplier (older Windows,
# some hosts) will scroll 16x too fast - re-pair/reinstall the HID device so
# Windows picks up the new report descriptor.
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
