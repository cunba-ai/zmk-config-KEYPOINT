# "Exit layer -> momentary layer" behavior.
#
# SPDX-License-Identifier: MIT

description: |
  Deactivate one layer and momentarily hold another on press.

  Usage: &mfl <exit_layer> <hold_layer>

  Press deactivates exit_layer (e.g. the pointing-device temp mouse layer,
  also cancelling its exit timer) and activates hold_layer; release
  deactivates hold_layer.

compatible: "zmk,behavior-mfl"

include: two_param.yaml
